<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · SteamPirata</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

    <link rel="stylesheet" href="../assets/store.css">
    <script src="https://kit.fontawesome.com/1eb4fd1ec9.js" crossorigin="anonymous"></script>
</head>

<body>

    <!--
        Vista de jugador con sesión iniciada. Lo que cambia según el rol:
        - Barra superior: el desarrollador ve Catálogo · Panel (dev_profile.html) · Perfil (user_profile.html).
        - Texto del banner: el saldo de créditos solo se muestra a jugadores.
        - Botón de favoritos de cada tarjeta: solo para jugadores.
    -->
    <header>
        <nav class="navbar navbar-expand-md topbar" >
            <div class="container-fluid">
                <a class="navbar-brand" href="store.html">SteamPirata</a>

                <div class="d-flex align-items-center gap-3 order-md-last">
                    <a class="btn btn-link px-0" href="login.html">Cerrar sesión</a>
                    <a class="usuario-nav" href="user_profile.html" title="Mi perfil">
                        <span class="d-none d-lg-inline">LuisDCG</span>
                        <span class="avatar avatar-sm" aria-hidden="true">LD</span>
                        <span class="visually-hidden">Ir a mi perfil</span>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" aria-current="page"
                                href="store.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="user_library.html">Biblioteca</a></li>
                        <li class="nav-item"><a class="nav-link" href="user_friends.html">Amigos</a></li>
                        <li class="nav-item"><a class="nav-link" href="user_profile.html">Perfil</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="banner-wrap">
        <div class="banner">
            <h1 class="titulo-catalogo">Catálogo</h1>
            <p class="banner-texto" id="bannerTexto">Explora los juegos publicados en SteamPirata.</p>
            <span class="banner-marca" aria-hidden="true">Juegos</span>
        </div>
    </div>

    <main class="contenido">

        <form class="d-flex flex-column gap-3" action="store.html" method="get" role="search">

            <div class="buscador">
                <label class="visually-hidden" for="busqueda">Buscar videojuegos por nombre</label>
                <input class="form-control" type="search" id="busqueda" name="q" placeholder="Buscar por nombre"
                    autocomplete="off">
                <button class="btn btn-primary btn-grande" type="submit">Buscar</button>
            </div>

            <button class="btn btn-outline-secondary d-md-none align-self-center" type="button"
                data-bs-toggle="collapse" data-bs-target="#filtros" aria-expanded="false"
                aria-controls="filtros">Filtros</button>

            <div class="collapse d-md-block" id="filtros">
                <div class="filtros-panel d-flex flex-column gap-4">

                    <fieldset>
                        <legend class="visually-hidden">Género</legend>
                        <div class="chips-genero">
                            <input class="btn-check" type="radio" name="genero" id="genTodos" value="" checked>
                            <label class="chip" for="genTodos">Todos</label>
                            <input class="btn-check" type="radio" name="genero" id="genAccion" value="Acción">
                            <label class="chip" for="genAccion">Acción</label>
                            <input class="btn-check" type="radio" name="genero" id="genAventura" value="Aventura">
                            <label class="chip" for="genAventura">Aventura</label>
                            <input class="btn-check" type="radio" name="genero" id="genCarreras" value="Carreras">
                            <label class="chip" for="genCarreras">Carreras</label>
                            <input class="btn-check" type="radio" name="genero" id="genDeportes" value="Deportes">
                            <label class="chip" for="genDeportes">Deportes</label>
                            <input class="btn-check" type="radio" name="genero" id="genEstrategia" value="Estrategia">
                            <label class="chip" for="genEstrategia">Estrategia</label>
                            <input class="btn-check" type="radio" name="genero" id="genRPG" value="RPG">
                            <label class="chip" for="genRPG">RPG</label>
                            <input class="btn-check" type="radio" name="genero" id="genSimulacion" value="Simulación">
                            <label class="chip" for="genSimulacion">Simulación</label>
                            <input class="btn-check" type="radio" name="genero" id="genTerror" value="Terror">
                            <label class="chip" for="genTerror">Terror</label>
                        </div>
                    </fieldset>

                    <div class="row g-3">
                        <div class="col-6 col-lg-3">
                            <label class="form-label" for="filtroClasificacion">Clasificación de edad</label>
                            <select class="form-select" id="filtroClasificacion" name="clasificacion">
                                <option value="" selected>Todas</option>
                                <option value="E">E · Todos</option>
                                <option value="T">T · +13</option>
                                <option value="M">M · +17</option>
                            </select>
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label" for="filtroPrecio">Precio máximo (créditos)</label>
                            <input class="form-control" type="number" id="filtroPrecio" name="precio_max" min="1"
                                step="1" placeholder="Sin límite" inputmode="numeric">
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label" for="filtroCalificacion">Calificación mínima</label>
                            <select class="form-select" id="filtroCalificacion" name="calificacion_min">
                                <option value="" selected>Cualquiera</option>
                                <option value="4">4 estrellas o más</option>
                                <option value="3">3 estrellas o más</option>
                                <option value="2">2 estrellas o más</option>
                            </select>
                        </div>
                        <div class="col-6 col-lg-3">
                            <label class="form-label" for="filtroOrden">Ordenar por</label>
                            <select class="form-select" id="filtroOrden" name="orden">
                                <option value="nombre" selected>Nombre (A–Z)</option>
                                <option value="precio_asc">Precio: menor a mayor</option>
                                <option value="precio_desc">Precio: mayor a menor</option>
                                <option value="calificacion">Mejor calificados</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center gap-2">
                        <a class="btn btn-link" href="store.html">Limpiar</a>
                        <button class="btn btn-primary" type="submit">Aplicar filtros</button>
                    </div>
                </div>
            </div>
        </form>

        <section aria-labelledby="tituloResultados" class="d-flex flex-column gap-3">
            <div class="d-flex flex-column gap-1">
                <h2 class="resultados-titulo" id="tituloResultados">Todos los videojuegos</h2>
                <p class="fila-meta mb-0" id="conteoResultados">Cargando catálogo…</p>
            </div>

            <ul class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4 list-unstyled mb-0" id="listaJuegos"
                aria-live="polite"></ul>
            <div class="text-center fila-meta py-5" id="sinJuegos" hidden>
                No encontramos videojuegos con esos filtros. <a href="store.html">Ver todo el catálogo</a>
            </div>
        </section>

        <nav aria-label="Paginación del catálogo">
            <ul class="pagination justify-content-center flex-wrap mb-0" id="paginacion"></ul>
        </nav>
    </main>

    <div class="modal fade" id="modalJuego" tabindex="-1" aria-labelledby="juegoTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-juego">
            <div class="modal-content">
                <button type="button" class="btn-close cerrar-modal" data-bs-dismiss="modal"
                    aria-label="Cerrar"></button>
                <div class="modal-body d-flex flex-column gap-4" id="modalJuegoCuerpo"></div>
                <div class="modal-footer justify-content-between" id="modalJuegoPie"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/store.js"></script>
</body>

</html>
